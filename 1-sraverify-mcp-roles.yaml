AWSTemplateFormatVersion: 2010-09-09
Description: This template deploys the role needed for SRA Verify MCP server to access each account.
Parameters:
  Role:
    Description: 'Specifies the role that can assume the SRA Verify MCP role.'
    Type: String
    Default: 'arn:aws:iam::123456789012:role/myrole'
    ConstraintDescription: Enter the ARN of the role that should be allowed to assume the SRAMemberMCPRole.

Resources:
  SRAMemberMCPRole:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: Resource has an explicit name so SRAVerify can loop through and assume it in each account.
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: SRAMemberMCPRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref Role
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Ref SRAVerifyLeastPrivilege
        - !Ref SRAVerifyCheckPermissions

  SRAVerifyCheckPermissions:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: Resource has an explicit name for documentation.
          - id: W13
            reason: SRA Verify needs read only * resource to evaluate configuration against SRA best practices.
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: SRAVerifyMCPCheckPermissions
      Description: Permissions for actions in check.py
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountPermissions
            Effect: Allow
            Action:
              - account:GetAccountInformation
            Resource: '*'

  # The Statement list between the BEGIN/END GENERATED markers below is written by sra-verify's util/generate_iam_policy.py
  # from the boto3 calls the package makes. Edit the code and re-run it, never the list.
  SRAVerifyLeastPrivilege:
