      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: Policy is automatically generated from generate_iam_policy.py
          - id: W13
            reason: SRA Verify needs read only * resource to evaluate configuration against SRA best practices.
    Type: AWS::IAM::ManagedPolicy
